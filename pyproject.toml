[project]
name = "dont-you-dare-go-hollow"
version = "0.1.0"
description = "A Souls-like study game: real study earns souls, missed days cost them."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
hollow-sync-anki = "hollow.cli:sync_anki"
hollow-anki-check = "hollow.cli:check_anki"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hollow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/hollow"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
