<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DontYouDareGoHollow{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=DotGothic16&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='hollow.css') }}">
  <link rel="icon" href="{{ url_for('static', path='sprites/item_ember.png') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <h1 class="title">DONT YOU DARE GO HOLLOW</h1>
      <nav class="nav" aria-label="Pages">
        <a href="/" {{ 'aria-current="page"' | safe if page == 'bonfire' }}>Bonfire</a>
        <a href="/character" {{ 'aria-current="page"' | safe if page == 'character' }}>Character</a>
        <span class="label">{{ state.today.strftime("%A %d %B") }}</span>
      </nav>
    </header>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
